  <!-- screen list -->
  <rect x="72"  y="418" width="220" height="80" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="182" y="452" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="13" fill="rgba(255,255,255,0.45)" letter-spacing="1">화면 01</text>
  <text x="182" y="480" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
