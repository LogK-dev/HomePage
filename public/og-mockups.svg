  <rect x="308" y="418" width="220" height="80" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="418" y="452" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="13" fill="rgba(255,255,255,0.45)" letter-spacing="1">화면 02</text>
  <text x="418" y="480" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="19" font-weight="700" fill="white">답변 비교</text>

  <rect x="544" y="418" width="220" height="80" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="654" y="452" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="13" fill="rgba(255,255,255,0.45)" letter-spacing="1">화면 03</text>
  <text x="654" y="480" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="19" font-weight="700" fill="white">개인정보 제어</text>

  <rect x="780" y="418" width="220" height="80" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="890" y="452" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="13" fill="rgba(255,255,255,0.45)" letter-spacing="1">화면 04</text>
  <text x="890" y="480" text-anchor="middle"
