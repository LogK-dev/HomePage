<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#07111F"/>
      <stop offset="60%"  stop-color="#0C1F4A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- ambient glows -->
  <circle cx="1080" cy="90"  r="320" fill="#2563EB" fill-opacity="0.13"/>
  <circle cx="80"   cy="560" r="220" fill="#1D4ED8" fill-opacity="0.10"/>

  <!-- brand mark -->
  <rect x="72" y="64" width="56" height="56" rx="14" fill="#2563EB"/>
  <text x="100" y="104" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="34" font-weight="800" fill="white">L</text>
  <text x="146" y="104"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="34" font-weight="700" fill="white">LogK</text>

  <!-- eyebrow -->
  <text x="72" y="196"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="19" font-weight="600" fill="#93C5FD" letter-spacing="2">
    기업용 멀티 AI 플랫폼
  </text>

  <!-- headline -->
  <text x="72" y="286"
        font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,Arial,sans-serif"
        font-size="70" font-weight="800" fill="white">여러 AI를, 조직에 맞게</text>
  <text x="72" y="372"
        font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,Arial,sans-serif"
        font-size="70" font-weight="800" fill="#93C5FD">안전하게 쓰세요.</text>

  <!-- feature pills -->
  <rect x="72"  y="422" width="216" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="180" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">멀티 LLM 위임</text>

  <rect x="304" y="422" width="244" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="426" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">개인정보 비식별화</text>

  <rect x="564" y="422" width="176" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="652" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">조직 관리</text>

  <rect x="756" y="422" width="200" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="856" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">결재 워크플로</text>

  <!-- description -->
  <text x="72" y="530"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="22" fill="rgba(255,255,255,0.50)">
    25개 이상의 AI 모델 · 원화 결제 지원 · 기업 보안 정책 연동
  </text>

  <!-- url -->
  <text x="1128" y="598" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="16" fill="rgba(255,255,255,0.28)">logk.co.kr</text>
</svg>
