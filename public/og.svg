<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Default OG image — used by any page that doesn't override `ogImageFile`.
       Mirrors the live site's light theme and hero typography. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="brand-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150"  cy="110" r="320" fill="#2563EB" fill-opacity="0.06"/>
  <circle cx="1080" cy="540" r="280" fill="#3B82F6" fill-opacity="0.05"/>

  <!-- Brand mark + wordmark (centered, big) -->
  <rect x="446" y="170" width="120" height="120" rx="32" fill="url(#brand-mark)"/>
  <text x="506" y="262" text-anchor="middle"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="78" font-weight="800" fill="white">L</text>
  <text x="600" y="258"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="78" font-weight="700" fill="#111827">LogK</text>

  <!-- Tagline -->
  <text x="600" y="380" text-anchor="middle"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="36" font-weight="700" fill="#1D4ED8" letter-spacing="2">기업용 멀티 AI 플랫폼</text>

  <text x="600" y="440" text-anchor="middle"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="22" fill="#4B5563">여러 AI를, 조직에 맞게, 안전하게 쓰세요.</text>

  <text x="600" y="478" text-anchor="middle"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="20" fill="#6B7280">멀티 LLM 동시 위임 · 개인정보 자동 비식별화 · 결제 워크플로</text>

  <text x="600" y="568" text-anchor="middle"
        font-family="Pretendard,system-ui,-apple-system,Arial,sans-serif"
        font-size="16" fill="#9CA3AF">logk.co.kr</text>
</svg>
