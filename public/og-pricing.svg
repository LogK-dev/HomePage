<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Mirrors the live pricing hero. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#EFF6FF"/>
      <stop offset="50%"  stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="brand-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="popular-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1D4ED8"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="popular-badge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="150"  cy="110" r="320" fill="#2563EB" fill-opacity="0.06"/>
  <circle cx="1080" cy="540" r="280" fill="#7C3AED" fill-opacity="0.04"/>

  <!-- Brand -->
  <rect x="72" y="60" width="52" height="52" rx="16" fill="url(#brand-mark)"/>
  <text x="98" y="98" text-anchor="middle"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="30" font-weight="800" fill="white">L</text>
  <text x="140" y="96"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="26" font-weight="700" fill="#111827">LogK</text>

  <!-- Pricing badge pill (matches .pricing-badge on the page) -->
  <rect x="72" y="156" width="320" height="36" rx="18" fill="#FFFFFF" stroke="#DBEAFE"/>
  <circle cx="92" cy="174" r="4" fill="#2563EB"/>
  <text x="106" y="180"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="14" font-weight="600" fill="#1D4ED8">지금 바로 시작 가능 · 원화 결제 지원</text>

  <!-- Title (2 lines like the page: title + titleEmphasis below) -->
  <text x="72" y="270"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="64" font-weight="800" fill="#111827" letter-spacing="-2">업무에 맞는 플랜을 선택하고</text>
  <text x="72" y="346"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-style="italic" font-size="64" font-weight="800" fill="#2563EB" letter-spacing="-2">AI 활용을 시작하세요</text>

  <!-- Description -->
  <text x="72" y="398"
        font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif"
        font-size="20" fill="#4B5563">모든 플랜에 멀티 LLM 비교 활용이 포함됩니다.</text>

  <!-- Plan cards row (4 columns), Pro highlighted -->
  <g font-family="Pretendard,system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
    <rect x="72"  y="450" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="192" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1">LITE</text>
    <text x="192" y="528" text-anchor="middle" font-size="28" font-weight="900" fill="#111827">₩10,000</text>

    <rect x="324" y="450" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="444" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1">STANDARD</text>
    <text x="444" y="528" text-anchor="middle" font-size="28" font-weight="900" fill="#111827">₩30,000</text>

    <!-- PRO (highlighted, raised look) -->
    <rect x="576" y="438" width="240" height="134" rx="14" fill="url(#popular-card)"/>
    <rect x="660" y="424" width="156" height="26" rx="13" fill="url(#popular-badge)"/>
    <text x="738" y="442" text-anchor="middle" font-size="13" font-weight="700" fill="white">🔥 가장 인기 있는 플랜</text>
    <text x="696" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="rgba(255,255,255,0.8)" letter-spacing="1">PRO</text>
    <text x="696" y="528" text-anchor="middle" font-size="28" font-weight="900" fill="white">₩50,000</text>

    <rect x="828" y="450" width="240" height="110" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="948" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1">BUSINESS</text>
    <text x="948" y="528" text-anchor="middle" font-size="28" font-weight="900" fill="#111827">₩100,000</text>
  </g>

  <text x="1128" y="600" text-anchor="end"
        font-family="Pretendard,system-ui,-apple-system,Arial,sans-serif"
        font-size="14" fill="#9CA3AF">logk.co.kr</text>
</svg>
