<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#07111F"/>
      <stop offset="60%"  stop-color="#0C1F4A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="90"  r="320" fill="#2563EB" fill-opacity="0.13"/>
  <circle cx="80"   cy="560" r="220" fill="#1D4ED8" fill-opacity="0.10"/>

  <!-- brand mark -->
  <rect x="72" y="64" width="56" height="56" rx="14" fill="#2563EB"/>
  <text x="100" y="104" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="34" font-weight="800" fill="white">L</text>
  <text x="146" y="104"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="34" font-weight="700" fill="white">LogK</text>

  <!-- eyebrow -->
  <text x="72" y="196"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-size="19" font-weight="600" fill="#93C5FD" letter-spacing="2">서비스 소개</text>

  <!-- headline -->
  <text x="72" y="286"
        font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,Arial,sans-serif"
        font-size="70" font-weight="800" fill="white">모델 고르고, 비용 보고,</text>
  <text x="72" y="372"
        font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,Arial,sans-serif"
        font-size="70" font-weight="800" fill="#93C5FD">답변을 비교하세요.</text>

  <!-- feature rows -->
  <rect x="72"  y="422" width="264" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="204" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">개인정보 자동 비식별화</text>

  <rect x="352" y="422" width="200" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="452" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">결제 워크플로</text>

  <rect x="568" y="422" width="220" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="678" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">이미지 생성 비교</text>

  <rect x="804" y="422" width="176" height="42" rx="10" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="892" y="449" text-anchor="middle"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="17" fill="rgba(255,255,255,0.80)">조직 관리</text>

  <!-- description -->
  <text x="72" y="530"
        font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,Arial,sans-serif"
        font-size="22" fill="rgba(255,255,255,0.50)">
    멀티 LLM 위임 · 실행 전 비용 확인 · 보안 정책 연동
  </text>

  <text x="1128" y="598" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="16" fill="rgba(255,255,255,0.28)">logk.co.kr</text>
</svg>
